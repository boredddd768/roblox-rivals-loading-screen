<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivals Loading Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000033 0%, #0000aa 50%, #000055 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .roblox-character {
            position: absolute;
            left: 5%;
            bottom: 20%;
            width: 80px;
            height: 120px;
        }

        .character-head {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 8px;
            margin: 0 auto 8px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
        }

        .character-head::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 2px;
        }

        .character-head::after {
            content: '';
            position: absolute;
            top: 15px;
            right: 15px;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 2px;
        }

        .character-body {
            width: 60px;
            height: 50px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 4px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
        }

        .crown-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .crown {
            width: 300px;
            height: auto;
            filter: drop-shadow(0 0 15px #00BFFF) drop-shadow(0 0 30px #0099FF);
            animation: crownSpin 3s linear infinite, crownMove 4s ease-in forwards 3s;
        }

        @keyframes crownSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes crownMove {
            0% {
                transform: translateX(0) rotate(360deg);
                opacity: 1;
            }
            100% {
                transform: translateX(800px) rotate(720deg);
                opacity: 0;
            }
        }

        .loading-text {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: textFadeOut 4s ease-in forwards 3s;
        }

        .loading-text p {
            font-size: 16px;
            font-weight: 600;
            color: #000033;
            white-space: nowrap;
        }

        @keyframes textFadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .crown {
                width: 200px;
            }
            
            .loading-text p {
                font-size: 14px;
            }
            
            .character-head {
                width: 50px;
                height: 50px;
            }
            
            .character-body {
                width: 50px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background">
            <div class="roblox-character">
                <div class="character-head"></div>
                <div class="character-body"></div>
            </div>
            
            <div class="crown-container">
                <img class="crown" src="https://raw.githubusercontent.com/boredddd768/roblox-rivals-loading-screen/main/image.jpeg" alt="Crown" onerror="this.style.display='none'">
            </div>
            
            <div class="loading-text">
                <p>fun fact: rivals might get revived if they solve their glitches</p>
            </div>
        </div>
    </div>
</body>
</html>
